name: Release

# 当推送 v 开头的 tag 时触发发布流程
on:
  push:
    tags:
      - 'v*'
      - 'dev'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        uses: addnab/docker-run-action@v3
        with:
          image: rust:alpine
          options: -v ${{ github.workspace }}:/workspace -e CARGO_TERM_COLOR=always
          run: |
            # Alpine 容器中需要安装编译依赖
            apk add --no-cache musl-dev pkgconf openssl-dev openssl-libs-static
            cd /workspace
            cargo build --release

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/one-mirror
