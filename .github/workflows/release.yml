name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        uses: addnab/docker-run-action@v3
        with:
          image: rust:alpine
          options: -v ${{ github.workspace }}:/workspace -e CARGO_TERM_COLOR=always
          run: |
            apk add --no-cache musl-dev pkgconf openssl-dev openssl-libs-static
            cd /workspace
            cargo build --release

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing latest release if exists
        if: steps.tag.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag == 'latest' && 'Latest (dev)' || steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.tag == 'latest' }}
          files: target/release/one-mirror
